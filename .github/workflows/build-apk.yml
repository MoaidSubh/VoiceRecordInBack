
{"name": "Build APK", "on": {"push": {}, "workflow_dispatch": {}},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"name": "Unzip project", "run": "unzip -o \"$(ls *.zip | head -1)\""},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.7"}},
{"name": "Build APK", "working-directory": "VoiceRecordInBack", "run": "gradle assembleRelease --no-daemon --stacktrace"},
{"name": "Rename APK", "run": "cp VoiceRecordInBack/app/build/outputs/apk/release/app-release.apk VoiceRecordInBack.apk"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "VoiceRecordInBack-APK", "path": "VoiceRecordInBack.apk"}}
]}}}
